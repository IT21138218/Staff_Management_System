# ===================================================================
# Staff Management System - REST API Configuration
# ===================================================================
spring.application.name=staff-management-system

# ---- Server ----
server.port=8080
server.error.include-message=always

# ---- Database (MySQL) ----
# Create the database first:  CREATE DATABASE sms_db;
spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# create-drop wipes data on every restart - switch to "update" once your schema is stable
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Kept open (unlike the Thymeleaf version) so lazy associations are still
# initialized while Jackson serializes the JSON response - see JacksonConfig.
spring.jpa.open-in-view=true

# ---- File upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Where employee photos are stored on disk; served back out at /uploads/** (see WebMvcConfig)
sms.uploads.dir=./uploads

# ---- JWT ----
# Change this secret before deploying anywhere real.
jwt.secret=Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItcHJvZHVjdGlvbi11c2Utb25seQ==
jwt.expiration-ms=86400000

# ---- App-specific settings ----
# Standard working hours per day, used by AttendanceService to flag late arrival
sms.attendance.work-start-time=09:00
sms.attendance.late-grace-minutes=15
sms.attendance.standard-hours-per-day=8

# Payroll config consumed by the PayrollConfig singleton (common.patterns.singleton)
sms.payroll.tax-rate=0.10
sms.payroll.overtime-multiplier=1.5

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.sliit.sms=DEBUG
