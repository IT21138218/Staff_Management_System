# Local-dev fallback profile: run with `--spring.profiles.active=h2` when a
# local MySQL instance isn't available/started. File-based H2 database,
# no external server needed. Activate with e.g.:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:file:./data/sms_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
